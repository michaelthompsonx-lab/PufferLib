[base]
env_name = breakout
async = 1

[vec]
total_agents = 8192
num_buffers = 1
num_threads = 8

[policy]
num_layers = 4
hidden_size = 32

[env]
num_agents = 1
frameskip = 3
width = 576
height = 330
paddle_width = 62
paddle_height = 8
ball_width = 32
ball_height = 32
brick_width = 32
brick_height = 12
brick_rows = 6
brick_cols = 18
initial_ball_speed = 256
max_ball_speed = 448
paddle_speed = 620
continuous = 0

[train]
total_timesteps = 31_715_582
learning_rate = 0.0659767911
gamma = 0.984804153
gae_lambda = 0.976535559
replay_ratio = 1.52127063
clip_coef = 0.560661972
vf_coef = 0.419067353
vf_clip_coef = 4.25895023
max_grad_norm = 1.5
ent_coef = 0.0145858051
momentum = 0.845884204
minibatch_size = 16384
horizon = 32

[sweep]
metric = perf
# Seconds on an RTX 5090: solving H=32 runs take 0.2-0.5 s.
max_suggestion_cost = 1
# Diverged and never-learned runs both end near 0 perf.
collapse_score = 0.05

# Fused MinGRU kernels cover hidden 32 and horizon <= 64; other shapes fall back to
# a several-x slower path, so their cost reflects the kernels, not the model.
[sweep.policy.hidden_size]
distribution = none

[sweep.train.horizon]
max = 64

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e6
max = 6e7
scale = auto

[sweep.env.frameskip]
distribution = int_uniform
min = 1
max = 8
mean = 4
scale = 2.0
